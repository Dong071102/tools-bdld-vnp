version: '3.8'

services:
  crawler-backend:
    build:
      context: ./crawler-backend
      dockerfile: Dockerfile
    container_name: tool-crawler-backend
    restart: always
    # Không expose port ra ngoài, chỉ giao tiếp nội bộ qua bdld-vnp-network
    environment:
      - DB_SERVER=${DB_SERVER:-10.61.202.116}
      - DB_PORT=${DB_PORT:-1433}
      - DB_USER=${DB_USER:-sa}
      - DB_PASSWORD=${DB_PASSWORD:-Sadmin123}
      - DB_NAME=${DB_NAME:-caw_powerbi_db}
      - PORT=8000
      - TZ=Asia/Ho_Chi_Minh
    networks:
      - bdld-vnp-network

  dinhvi-backend:
    build:
      context: ./dinhvi-backend
      dockerfile: Dockerfile
    container_name: vnpost_backend
    restart: always
    # Không expose port ra ngoài, chỉ giao tiếp nội bộ qua bdld-vnp-network
    environment:
      - PORT=5000
      - JWT_SECRET=${JWT_SECRET:-vnpost-excel-exporter-jwt-secret-key-2026-dynamic-secure}
      - DB_HOST=${DB_SERVER:-10.61.202.116}
      - DB_PORT=${DB_PORT:-1433}
      - DB_USER=${DB_USER:-sa}
      - DB_PASSWORD=${DB_PASSWORD:-Sadmin123}
      - DB_NAME=${DB_NAME:-caw_powerbi_db}
    depends_on:
      - crawler-backend
    networks:
      - bdld-vnp-network

  dinhvi-frontend:
    build:
      context: ./dinhvi-frontend
      dockerfile: Dockerfile
    container_name: tool-dinhvi-frontend
    restart: always
    ports:
      - "9999:80"
    depends_on:
      - dinhvi-backend
    networks:
      - bdld-vnp-network

networks:
  bdld-vnp-network:
    external: true

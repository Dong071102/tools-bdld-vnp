version: '3.8'

services:
  crawler-backend:
    build:
      context: ./crawler-backend
      dockerfile: Dockerfile
    container_name: tool-crawler-backend
    restart: always
    ports:
      - "${CRAWLER_PORT:-8000}:8000"
    environment:
      - DB_SERVER=${DB_SERVER}
      - DB_PORT=${DB_PORT:-1433}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - PORT=8000
      - TZ=Asia/Ho_Chi_Minh
    networks:
      - bdld-vnp-network

  dinhvi-backend:
    build:
      context: ./dinhvi-backend
      dockerfile: Dockerfile
    container_name: tool-dinhvi-backend
    restart: always
    ports:
      - "${DINHVI_BACKEND_PORT:-5000}:5000"
    environment:
      - PORT=5000
      - JWT_SECRET=${JWT_SECRET:-vnpost-excel-exporter-jwt-secret-key-2026-dynamic-secure}
      - DB_HOST=${DB_SERVER}
      - DB_PORT=${DB_PORT:-1433}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
    depends_on:
      - crawler-backend
    networks:
      - bdld-vnp-network

  dinhvi-frontend:
    build:
      context: ./dinhvi-frontend
      dockerfile: Dockerfile
    container_name: tool-dinhvi-frontend
    restart: always
    ports:
      - "${DINHVI_FRONTEND_PORT:-80}:80"
    depends_on:
      - dinhvi-backend
    networks:
      - bdld-vnp-network

networks:
  bdld-vnp-network:
    external: true

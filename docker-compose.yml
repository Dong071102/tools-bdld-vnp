version: '3.8'

services:
  crawler-backend:
    image: ghcr.io/dong071102/tools-bdld-vnp-crawler-backend:latest
    container_name: tool-crawler-backend
    restart: always
    # Không expose port ra ngoài, chỉ giao tiếp nội bộ qua bdld-vnp-network
    environment:
      - DB_SERVER=10.61.202.116
      - DB_PORT=1433
      - DB_USER=sa
      - DB_PASSWORD=Sadmin123
      - DB_NAME=caw_powerbi_db
      - PORT=8000
      - TZ=Asia/Ho_Chi_Minh
    networks:
      - bdld-vnp-network

  dinhvi-backend:
    image: ghcr.io/dong071102/tools-bdld-vnp-dinhvi-backend:latest
    container_name: vnpost_backend
    restart: always
    # Không expose port ra ngoài, chỉ giao tiếp nội bộ qua bdld-vnp-network
    environment:
      - PORT=5000
      - JWT_SECRET=vnpost-excel-exporter-jwt-secret-key-2026-dynamic-secure
      - DB_HOST=10.61.202.116
      - DB_PORT=1433
      - DB_USER=sa
      - DB_PASSWORD=Sadmin123
      - DB_NAME=caw_powerbi_db
    depends_on:
      - crawler-backend
    networks:
      - bdld-vnp-network

  dinhvi-frontend:
    image: ghcr.io/dong071102/tools-bdld-vnp-dinhvi-frontend:latest
    container_name: tool-dinhvi-frontend
    restart: always
    ports:
      - "9999:80"
    depends_on:
      - dinhvi-backend
    networks:
      - bdld-vnp-network

networks:
  bdld-vnp-network:
    external: true

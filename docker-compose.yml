version: '3.8'

services:
  vnp-crawler-backend:
    image: ghcr.io/dong071102/tools-bdld-vnp-crawler-backend:latest
    container_name: vnp-crawler-backend
    restart: always
    # Không expose port ra ngoài, chỉ giao tiếp nội bộ qua bdld-vnp-network
    environment:
      - DB_SERVER=10.61.202.116
      - DB_PORT=1433
      - DB_USER=sa
      - DB_PASSWORD=Sadmin123
      - DB_NAME=caw_powerbi_db
      - PORT=8000
      - TZ=Asia/Ho_Chi_Minh
      - DINHVI_BACKEND_URL=http://vnp-dinhvi-backend:5000 # URL trỏ sang Node.js backend mới trong mạng Docker
    networks:
      - bdld-vnp-network

  vnp-dinhvi-backend:
    image: ghcr.io/dong071102/tools-bdld-vnp-dinhvi-backend:latest
    container_name: vnp-dinhvi-backend
    restart: always
    # Không expose port ra ngoài, chỉ giao tiếp nội bộ qua bdld-vnp-network
    environment:
      - PORT=5000
      - JWT_SECRET=vnpost-excel-exporter-jwt-secret-key-2026-dynamic-secure
      - DB_HOST=10.61.202.116
      - DB_PORT=1433
      - DB_USER=sa
      - DB_PASSWORD=Sadmin123
      - DB_NAME=caw_powerbi_db
    depends_on:
      - vnp-crawler-backend
    networks:
      - bdld-vnp-network

  tools-bdld-vnp-frontend:
    image: ghcr.io/dong071102/tools-bdld-vnp-frontend:latest
    container_name: tools-bdld-vnp-frontend
    restart: always
    ports:
      - "9999:80" # Mở duy nhất cổng 9999 cho giao diện gộp chính
    depends_on:
      - vnp-dinhvi-backend
    networks:
      - bdld-vnp-network

networks:
  bdld-vnp-network:
    external: true

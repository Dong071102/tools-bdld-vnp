version: '3.8'

services:
  vnp-crawler-backend:
    build:
      context: ./crawler-backend
    container_name: vnp-crawler-backend
    restart: always
    environment:
      - DB_SERVER=${DB_SERVER:-10.61.200.10}
      - DB_PORT=${DB_PORT:-1433}
      - DB_USER=${DB_USER:-sa}
      - DB_PASSWORD=${DB_PASSWORD:-Sadmin123}
      - DB_NAME=${DB_NAME:-caw_powerbi_db}
      - PORT=${CRAWLER_PORT:-8000}
      - TZ=${TZ:-Asia/Ho_Chi_Minh}
      - DINHVI_BACKEND_URL=${DINHVI_BACKEND_URL:-http://vnp-dinhvi-backend:5000}
      - POWERBI_URL=${POWERBI_URL:-https://app.powerbi.com/view?r=eyJrIjoiNjk5OGZhNDEtZTc3NC00ODgyLThlYjAtZGE3MTUyY2Q1ZmYzIiwidCI6IjRkNmQ2N2FlLTViNTUtNDJhYy05ZGFhLTkzOTk3Yzc3YTg3YSIsImMiOjEwfQ==}
      - JWT_SECRET=${JWT_SECRET:-vnpost-excel-exporter-jwt-secret-key-2026-dynamic-secure}
    networks:
      - bdld-vnp-network

  vnp-dinhvi-backend:
    build:
      context: ./dinhvi-backend
    container_name: vnp-dinhvi-backend
    restart: always
    environment:
      - PORT=${DINHVI_PORT:-5000}
      - JWT_SECRET=${JWT_SECRET:-vnpost-excel-exporter-jwt-secret-key-2026-dynamic-secure}
      - DB_HOST=${DB_HOST:-${DB_SERVER:-10.61.200.10}}
      - DB_SERVER=${DB_SERVER:-10.61.200.10}
      - DB_PORT=${DB_PORT:-1433}
      - DB_USER=${DB_USER:-sa}
      - DB_PASSWORD=${DB_PASSWORD:-Sadmin123}
      - DB_NAME=${DB_NAME:-caw_powerbi_db}
    depends_on:
      - vnp-crawler-backend
    networks:
      - bdld-vnp-network

  tools-bdld-vnp-frontend:
    build:
      context: ./frontend
    container_name: tools-bdld-vnp-frontend
    restart: always
    ports:
      - "${FRONTEND_PORT:-9999}:80"
    depends_on:
      - vnp-dinhvi-backend
    networks:
      - bdld-vnp-network

networks:
  bdld-vnp-network:
    driver: bridge

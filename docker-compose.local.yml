version: '3.8'

services:
  vnp-crawler-backend:
    build:
      context: ./crawler-backend
    container_name: vnp-crawler-backend
    restart: always
    environment:
      - DB_SERVER=10.61.200.10
      - DB_PORT=1433
      - DB_USER=sa
      - DB_PASSWORD=Sadmin123
      - DB_NAME=caw_powerbi_db
      - PORT=8000
      - TZ=Asia/Ho_Chi_Minh
      - DINHVI_BACKEND_URL=http://vnp-dinhvi-backend:5000
    networks:
      - bdld-vnp-network

  vnp-dinhvi-backend:
    build:
      context: ./dinhvi-backend
    container_name: vnp-dinhvi-backend
    restart: always
    environment:
      - PORT=5000
      - JWT_SECRET=vnpost-excel-exporter-jwt-secret-key-2026-dynamic-secure
      - DB_HOST=10.61.200.10
      - DB_PORT=1433
      - DB_USER=sa
      - DB_PASSWORD=Sadmin123
      - DB_NAME=caw_powerbi_db
    depends_on:
      - vnp-crawler-backend
    networks:
      - bdld-vnp-network

  tools-bdld-vnp-frontend:
    build:
      context: ./frontend
    container_name: tools-bdld-vnp-frontend
    restart: always
    ports:
      - "9999:80"
    depends_on:
      - vnp-dinhvi-backend
    networks:
      - bdld-vnp-network

networks:
  bdld-vnp-network:
    driver: bridge

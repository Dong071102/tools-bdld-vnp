<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Sidebar extension nhập danh sách bưu gửi VNPost, xuất Excel theo lô 500 mã và gộp dữ liệu tự động."
    />
    <title>VNPost BCCP Excel Exporter</title>
    <link rel="stylesheet" href="sidebar.css" />
  </head>
  <body>
    <main class="app-shell" aria-labelledby="app-title">
      <section class="hero-card">
        <div class="brand-row">
          <div class="brand-mark" aria-hidden="true">VN</div>
          <div>
            <p class="eyebrow">BCCP TraceList v2</p>
            <h1 id="app-title">Xuất Excel bưu gửi</h1>
          </div>
        </div>
        <p class="hero-copy">
          Nhập danh sách mã bưu gửi, extension tự chia 500 mã/lần, tải các file Excel và gộp thành một file duy nhất.
        </p>
      </section>

      <section class="panel-card input-card" aria-labelledby="input-title">
        <div class="section-heading">
          <h2 id="input-title">Danh sách bưu gửi</h2>
          <span id="code-count-badge" class="badge">0 mã</span>
        </div>
        <label class="sr-only" for="shipment-input">Nhập mã bưu gửi</label>
        <textarea
          id="shipment-input"
          spellcheck="false"
          placeholder="Ví dụ:&#10;CE991562158VN&#10;EA123456789VN&#10;Hoặc dán danh sách phân tách bằng dấu phẩy/khoảng trắng"
        ></textarea>
        <div class="actions-grid">
          <button id="sample-button" class="ghost-button" type="button">Dán mẫu</button>
          <button id="clear-button" class="ghost-button danger" type="button">Xóa</button>
        </div>
      </section>

      <section class="panel-card status-card" aria-labelledby="status-title">
        <div class="section-heading">
          <h2 id="status-title">Tiến độ xử lý</h2>
          <span id="state-pill" class="state-pill idle">Sẵn sàng</span>
        </div>
        <div class="meter" aria-label="Tiến độ xuất Excel">
          <div id="progress-bar" class="meter-fill"></div>
        </div>
        <div class="stats-grid">
          <div class="stat-tile">
            <span>Tổng mã</span>
            <strong id="total-codes">0</strong>
          </div>
          <div class="stat-tile">
            <span>Số batch</span>
            <strong id="total-batches">0</strong>
          </div>
          <div class="stat-tile">
            <span>Đã xong</span>
            <strong id="done-batches">0</strong>
          </div>
        </div>
        <ol id="log-list" class="log-list" aria-live="polite"></ol>
      </section>

      <section class="sticky-actions" aria-label="Thao tác xuất file">
        <button id="export-button" class="primary-button" type="button">
          <span>Xuất & gộp Excel</span>
          <span class="button-shine" aria-hidden="true"></span>
        </button>
        <button id="download-button" class="secondary-button" type="button" disabled>Tải file đã gộp</button>
      </section>
    </main>

    <script src="sidebar.js"></script>
  </body>
</html>

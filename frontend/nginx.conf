server {
    listen 80;
    server_name localhost;
    client_max_body_size 100M;

    # Sử dụng Docker internal DNS resolver để resolve tên container động
    resolver 127.0.0.11 valid=30s ipv6=off;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # API của Node.js Backend (dinhvi-backend) cho quản lý luồng
    location /api/vnpost {
        set $backend_dinhvi vnp-dinhvi-backend;
        proxy_pass http://$backend_dinhvi:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
    }

    # API của Node.js Backend (dinhvi-backend) cho xuất định vị bưu gửi
    location /api/export {
        set $backend_dinhvi vnp-dinhvi-backend;
        proxy_pass http://$backend_dinhvi:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
    }

    # API của Node.js Backend (dinhvi-backend) cho gộp Excel
    location /api/merge-and-save {
        set $backend_dinhvi vnp-dinhvi-backend;
        proxy_pass http://$backend_dinhvi:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
    }


    # Tất cả các API còn lại (auth, admin, user, status, summary, detailed...) sang Python Backend (crawler-backend)
    location /api {
        set $backend_crawler vnp-crawler-backend;
        proxy_pass http://$backend_crawler:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
    }
}

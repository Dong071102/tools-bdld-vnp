name: Build and Publish Docker Images

on:
  push:
    branches:
      - main
      - master

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Downcase repo owner name
        run: |
          echo "OWNER_LC=${OWNER,,}" >> ${GITHUB_ENV}
        env:
          OWNER: '${{ github.repository_owner }}'

      # 1. Build and Push Crawler Backend
      - name: Build and push Crawler Backend
        uses: docker/build-push-action@v5
        with:
          context: ./crawler-backend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/tools-bdld-vnp-crawler-backend:latest

      # 2. Build and Push Dinhvi Backend
      - name: Build and push Dinhvi Backend
        uses: docker/build-push-action@v5
        with:
          context: ./dinhvi-backend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/tools-bdld-vnp-dinhvi-backend:latest

      # 3. Build and Push Dinhvi Frontend
      - name: Build and push Dinhvi Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./dinhvi-frontend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/tools-bdld-vnp-dinhvi-frontend:latest
